<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众包美食家 · 运行状态</title>
<style>
  :root{--brand:#b45309;--bg:#0f141b;--card:#1a2230;--ink:#e5e9f0;--sub:#8b94a7;--ok:#34d399;--err:#f87171;--warn:#fbbf24;--line:#263042}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:-apple-system,'PingFang SC',sans-serif;color:var(--ink);padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:19px;margin-bottom:2px}
  .sub{color:var(--sub);font-size:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:12px;padding:14px}
  .stat .v{font-size:24px;font-weight:700}
  .stat .v small{font-size:13px;font-weight:400;color:var(--sub)}
  .stat .l{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
  .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin-bottom:8px;color:var(--sub)}
  .card .big{font-size:16px;font-weight:600;margin-bottom:6px}
  .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,var(--ok));border-radius:4px;transition:width .5s}
  .muted{color:var(--sub)}
  /* 时间线式动态 */
  .feed{margin-top:4px}
  .feed .group{font-size:11px;color:var(--sub);margin:12px 0 4px;letter-spacing:.05em}
  .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .ev:last-child{border-bottom:none}
  .ev .t{font-size:11px;color:var(--sub);min-width:64px;flex-shrink:0}
  .ev .what{flex:1;font-size:13px;line-height:1.5}
  .ev .what b{font-weight:600}
  .ev .n{font-size:11px;color:var(--sub)}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;flex-shrink:0}
  .tag.a{background:#064e3b;color:#6ee7b7}
  .tag.r{background:#4c1d1d;color:#fca5a5}
  .tag.d{background:#3f3a1d;color:#fde68a}
  .beat{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<h1>🍜 众包美食家 · 运行状态</h1>
<p class="sub"><span class="beat"></span><span id="genAt">载入中…</span> · 每分钟自动刷新 · 电脑关机也不影响采集</p>

<div class="grid">
  <div class="stat ok"><div class="v" id="stAccepted">-</div><div class="l" id="stAcceptedL">累计收录</div></div>
  <div class="stat warn"><div class="v" id="stOpen">-</div><div class="l" id="stOpenL">任务</div></div>
  <div class="stat"><div class="v" id="stActive">-</div><div class="l" id="stActiveL">参与者</div></div>
  <div class="stat"><div class="v" id="stRate">-</div><div class="l" id="stRateL">拒收率</div></div>
</div>

<div class="card">
  <h2>任务进度</h2>
  <div class="big" id="taskBig">-</div>
  <div class="muted" id="taskDist" style="font-size:12px">-</div>
  <div class="bar"><i id="taskBar" style="width:0%"></i></div>
</div>

<div class="card">
  <h2>最新动态</h2>
  <div class="feed" id="feed"><div class="muted">载入中…</div></div>
</div>

<script>
(function(){
"use strict";
const API_BASE = "https://bdwrhshgdeghgyzwpxnl.supabase.co";
const API_KEY = "sb_publishable_c93XenGzZsoa308e3bTg6A__lfaqQ-B";
const $ = (id) => document.getElementById(id);

/* —— 人话时间：刚刚 / n 分钟前 / n 小时前 / 昨天 HH:MM / MM-DD HH:MM —— */
function humanTime(iso){
  const t = new Date(iso), now = Date.now(), diff = (now - t.getTime()) / 1000;
  const hm = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  if (diff < 90) return "刚刚";
  if (diff < 3600) return Math.round(diff/60) + " 分钟前";
  if (diff < 86400){
    const h = Math.round(diff/3600);
    return h <= 1 ? "1 小时前" : h + " 小时前";
  }
  if (diff < 172800) return "昨天 " + hm;
  return (t.getMonth()+1) + "-" + String(t.getDate()).padStart(2,"0") + " " + hm;
}
/* —— 动态分组标题 —— */
function groupOf(iso){
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600) return "最近一小时";
  if (diff < 86400) return "今天";
  return "更早";
}
/* —— 拒收率评语 —— */
function rateWord(pct){
  if (pct == null) return "";
  if (pct <= 5) return " · 质量很好";
  if (pct <= 15) return " · 正常";
  return " · 偏高，需关注";
}

async function load() {
  try {
    const r = await fetch(API_BASE + "/rest/v1/rpc/crowd_status_summary", {
      method: "POST", cache: "no-store",
      headers: {"Content-Type":"application/json","apikey":API_KEY,"Authorization":"Bearer "+API_KEY},
      body: "{}"
    });
    const d = await r.json();
    if (!d.ok) throw new Error("bad");

    /* 顶部心跳 */
    const last = d.recent && d.recent.length ? new Date(d.recent[0].created_at) : null;
    const ago = last ? humanTime(d.recent[0].created_at) : null;
    $("genAt").textContent = "更新于 " + new Date(d.generated_at).toLocaleTimeString() +
      (ago ? " · 最近一条提交在 " + ago : "");

    /* 统计卡（人话版） */
    $("stAccepted").innerHTML = d.flow.accepted_total + ' <small>条</small>';
    $("stAcceptedL").textContent = "笔记已入册 · 今天 +" + d.flow.accepted_today;
    $("stOpen").innerHTML = d.tasks.open + ' <small>个开放</small>';
    $("stOpenL").textContent = "共 " + d.tasks.total + " 个任务 · " + d.tasks.in_progress + " 个进行中";
    $("stActive").innerHTML = d.participants.active_24h + ' <small>人今天活跃</small>';
    $("stActiveL").textContent = "共 " + d.participants.total + " 位参与者报名";
    const denom = d.flow.accepted_total + d.flow.rejected_total;
    const pct = denom ? Math.round(d.flow.rejected_total * 100 / denom) : null;
    $("stRate").textContent = pct == null ? "-" : pct + "%";
    $("stRateL").textContent = denom ? (d.flow.rejected_total + " 条被拒" + rateWord(pct)) : "还没有拒收";

    /* 任务进度 */
    const done = d.tasks.fulfilled + d.tasks.closed;
    const tpct = d.tasks.total ? Math.round(done * 100 / d.tasks.total) : 0;
    $("taskBig").textContent = "已完成 " + done + " / " + d.tasks.total + "（" + tpct + "%）";
    $("taskDist").textContent = "✅ 完成 " + d.tasks.fulfilled + " · 🔵 进行中 " + d.tasks.in_progress +
      " · 🟡 开放 " + d.tasks.open + " · ⚪ 关闭 " + d.tasks.closed;
    $("taskBar").style.width = tpct + "%";

    /* 最新动态：同店同人同时段合并成一条「×N」 */
    const merged = [];
    (d.recent || []).forEach(x => {
      const prev = merged[merged.length - 1];
      const sameMin = prev && prev.store === (x.matched_store || "—") &&
        prev.pid === x.participant_id && prev.status === x.gate_status &&
        (new Date(x.created_at) - new Date(prev.at)) < 10 * 60 * 1000;
      if (sameMin) { prev.n++; prev.at = x.created_at; }
      else merged.push({store: x.matched_store || "—", pid: (x.participant_id || "").slice(0, 9),
                        status: x.gate_status, at: x.created_at, n: 1});
    });
    let html = "", lastGroup = "";
    merged.forEach(m => {
      const g = groupOf(m.at);
      if (g !== lastGroup) { html += '<div class="group">' + g + '</div>'; lastGroup = g; }
      const tag = m.status === "accepted" ? '<span class="tag a">收录</span>'
        : m.status === "rejected" ? '<span class="tag r">拒收</span>'
        : '<span class="tag d">重复</span>';
      html += '<div class="ev"><span class="t">' + humanTime(m.at) + '</span>' +
        '<span class="what"><b>' + m.store + '</b>' +
        (m.n > 1 ? ' <span class="n">×' + m.n + '</span>' : '') +
        '<br><span class="n">' + m.pid + '</span></span>' + tag + '</div>';
    });
    $("feed").innerHTML = html || '<div class="muted">还没有提交</div>';
  } catch (e) {
    $("genAt").textContent = "刷新失败，稍后自动重试";
  }
}
load();
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("pageshow", (e) => { if (e.persisted) load(); });
})();
</script>
</body>
</html>
