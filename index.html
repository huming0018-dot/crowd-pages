<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众包美食家</title>
<style>
  :root{--brand:#b45309;--bg:#faf7f2;--card:#fff;--sub:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#1a1a2e;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 16px}
  .wrap{max-width:480px;width:100%;text-align:center}
  h1{font-size:26px;margin-bottom:6px}
  .sub{color:var(--sub);font-size:14px;margin-bottom:28px;line-height:1.6}
  .card{background:var(--card);border-radius:16px;padding:24px 20px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .detected{font-size:13px;color:var(--sub);margin-bottom:14px}
  .btn{display:block;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:18px 20px;font-size:19px;font-weight:700;cursor:pointer;text-decoration:none;margin:6px 0}
  .btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand);font-size:15px;font-weight:600;padding:12px 16px}
  .note{font-size:13px;color:var(--sub);margin-top:14px;line-height:1.7;text-align:left}
  .step{font-size:14px;color:#374151;text-align:left;margin:6px 0;line-height:1.6}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍜 众包美食家</h1>
  <p class="sub">帮我们一起收录上海的宝藏餐厅</p>

  <div class="card">
    <div class="detected" id="detected">正在识别你的设备…</div>
    <div id="action"></div>
    <div id="steps"></div>
  </div>

  <p class="sub" style="margin-top:20px;font-size:12px">知情自愿 · 只采公开笔记 · 随时退出</p>
</div>

<script>
(function () {
  const BUCKET = "https://bdwrhshgdeghgyzwpxnl.supabase.co/storage/v1/object/public/crowd";
  const ua = navigator.userAgent;
  const isAndroid = /android/i.test(ua);
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isMac = /mac/i.test(ua) && !isIOS;
  const isWin = /win/i.test(ua);

  const $ = (id) => document.getElementById(id);
  function show(html) { $("action").innerHTML = html; }
  function steps(html) { $("steps").innerHTML = html; }

  if (isAndroid || isIOS) {
    // 手机：免安装网页就是主路径（一键）
    $("detected").textContent = isAndroid ? "检测到：安卓手机" : "检测到：iPhone";
    show('<a class="btn" href="submit.html">🚀 开始参与（免安装）</a>' +
         (isAndroid ? '<a class="btn alt" href="https://bdwrhshgdeghgyzwpxnl.supabase.co/storage/v1/object/public/crowd/crowd-extension-v3.4.1-firefox-signed.xpi">想要全自动？装 Firefox 后点这里一键装插件</a>'
                    : '<a class="btn alt" href="https://bdwrhshgdeghgyzwpxnl.supabase.co/storage/v1/object/public/crowd/crowd-ios.shortcut">⚡ 加装快捷指令：小红书分享→自动提交</a>'));
    steps('<div class="step">① 点上面的橙色按钮</div>' +
          '<div class="step">② 点「我要加入」领编号</div>' +
          '<div class="step">③ 按页面派的店找笔记提交，完成</div>' +
          (isAndroid ? '<div class="note">安卓用户装 Firefox 浏览器后点第二个按钮，可一键装插件实现全自动采集。</div>'
                     : '<div class="note">iPhone：装第二个按钮的快捷指令后，小红书 App 里「分享 → 众包美食家」即可自动提交。首次使用会问一次参与编号。</div>'));
  } else if (isMac) {
    $("detected").textContent = "检测到：Mac 电脑";
    show('<a class="btn" href="' + BUCKET + '/crowd-install-mac.command" download="安装.command">⬇️ 下载一键安装器</a>');
    steps('<div class="step">① 点上面按钮下载，然后在「下载」文件夹找到 <b>安装.command</b></div>' +
          '<div class="step">② <b>右键点它 → 选「打开」</b>（苹果安全提示再点「打开」）<br><span class="note">直接双击会被苹果拦住，一定要右键打开</span></div>' +
          '<div class="step">③ 输一次开机密码（输入时不显示），回车</div>' +
          '<div class="step">④ Chrome 自动装好插件并全自动采集，以后自动升级</div>');
    setTimeout(() => { document.querySelector(".btn").click(); }, 600);
  } else if (isWin) {
    $("detected").textContent = "检测到：Windows 电脑";
    show('<a class="btn" href="' + BUCKET + '/crowd-install-win.bat" download="安装.bat">⬇️ 下载一键安装器</a>');
    steps('<div class="step">① 点上面按钮下载（自动开始）</div>' +
          '<div class="step">② 双击运行（蓝色提示点「仍要运行」）</div>' +
          '<div class="step">③ Chrome 自动装好插件并全自动采集，以后自动升级</div>');
    setTimeout(() => { document.querySelector(".btn").click(); }, 600);
  } else {
    $("detected").textContent = "未识别的设备";
    show('<a class="btn" href="submit.html">🚀 网页版直接参与</a>' +
         '<a class="btn alt" href="install.html">查看全部安装方式</a>');
  }
})();
</script>
</body>
</html>
